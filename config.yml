baseURL: "https://pmchp.pages.dev/"
title: PostMineClan
copyright: "" # TODO: 設定する
theme: [hugo-PaperMod]

defaultContentLanguage: ja
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: false

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 3

taxonomies:
      category: categories
      tag: tags
      series: series
menu:
  main:
    - name: Posts
      url: posts/
      weight: 1
    - name: Archive
      url: archives/
      weight: 2
    - name: Search
      url: search/
      weight: 3
    - name: Tags
      url: tags/
      weight: 4

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: ""
  author: ["nakam","donabe"]
  # author: ["Me", "You"] # multiple authors


  defaultTheme: light
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  disableSpecial1stPost: true
  # displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  homeInfoParams:
    Title: "PostMineClan"
    Content: |
      PostMineClanは主にMinecraftサーバーでワイワイしている招待制のグループです
    ImageUrl: "/logo/PMC_logo.jpg"

  profileMode:
    enabled: false
    title: "PostMineClan" # optional default will be site title
    subtitle: "好きなものが作れる世界"
    imageUrl: "/logo/PMC_logo.jpg" # optional
    imageTitle: "PMC Logo" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size
    buttons:
      - name: 投稿を見る
        url: "/posts/"

  socialIcons:
    - name: X
      title: Follow me on X/Twitter
      url: "https://x.com/MRT1019PMC"
    - name: GitHub
      title: View Source on Github
      url: "https://github.com/donabeya/new-pmc-website"

  editPost:
    URL: "https://github.com/donabeya/new-pmc-website.git"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25" viewBox="0 -960 960 960" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>'
  # text: "Home"
  # icon: icon.png
  # iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: true
    favicon: "logo/PMC_logo.jpg"
    favicon16x16: "logo/PMC_logo.jpg"
    favicon32x32: "logo/PMC_logo.jpg"
    apple_touch_icon: "logo/PMC_logo.jpg"
    safari_pinned_tab: "logo/PMC_logo.jpg"

  cover:
      hidden: false # hide everywhere but not in structured data
      hiddenInList: false # hide on list pages and home
      hiddenInSingle: false # hide on single page
      responsiveImages: true
      linkFullImages: true

  fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

