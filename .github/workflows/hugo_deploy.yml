name: ビルドしてCloudflare Pagesにデプロイ

on:
  push:
    branches:
      - '**'

jobs:

  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Build
        run: hugo

      - name: Debug public
        run: |
          echo "Public dir summary"
          du -sh public || true
          echo "Total files in public:"
          find public -type f | wc -l || true
          echo "Top 50 image files (path size):"
          find public -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) -printf "%p %s\n" | sort -nr -k2 | head -n 50 || true

      - name: Upload public
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    env:
      PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
      API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Download public
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: リリース
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          command: pages deploy public --project-name="${{ env.PROJECT_NAME }}" --branch="main"

      - name: プレビューリリース
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          command: pages deploy public --project-name="${{ env.PROJECT_NAME }}" --branch="${{ github.ref_name }}"
